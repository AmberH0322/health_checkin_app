<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>用户注册</title>
    <style>
        body {
            margin: 0;
            font-family: "Microsoft YaHei", Arial, sans-serif;
            background: linear-gradient(135deg, #4f8cff, #35c2a1);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .register-box {
            width: 430px;
            background: white;
            border-radius: 18px;
            padding: 36px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.16);
        }
        h1 {
            margin: 0 0 10px;
            text-align: center;
            color: #2f6fed;
            font-size: 26px;
        }
        .sub-title {
            text-align: center;
            color: #666;
            margin-bottom: 24px;
        }
        label {
            display: block;
            margin-top: 14px;
            margin-bottom: 6px;
            font-weight: bold;
            color: #333;
        }
        input, select {
            width: 100%;
            box-sizing: border-box;
            padding: 11px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
        }
        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }
        button {
            width: 100%;
            margin-top: 24px;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #2f6fed;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background: #245bd0;
        }
        .error {
            margin-top: 16px;
            color: #d64545;
            text-align: center;
            font-weight: bold;
        }
        .success {
            margin-top: 16px;
            color: #1f9d55;
            text-align: center;
            font-weight: bold;
        }
        .link {
            margin-top: 18px;
            text-align: center;
        }
        .link a {
            color: #2f6fed;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="register-box">
        <h1>用户注册</h1>
        <div class="sub-title">创建你的健康生活打卡账号</div>

        <form method="post">
            <label>用户名</label>
            <input type="text" name="username" placeholder="请输入用户名" required>

            <label>密码</label>
            <input type="password" name="password" placeholder="请输入密码" required>

            <label>手机号</label>
            <input type="text" name="phone" placeholder="请输入手机号">

            <div class="row">
                <div>
                    <label>性别</label>
                    <select name="gender">
                        <option value="男">男</option>
                        <option value="女">女</option>
                    </select>
                </div>
                <div>
                    <label>年龄</label>
                    <input type="number" name="age" placeholder="年龄">
                </div>
            </div>

            <button type="submit">注册</button>
        </form>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        {% if success %}
            <div class="success">{{ success }}</div>
        {% endif %}

        <div class="link">
            已有账号？<a href="/login">返回登录</a>
        </div>
    </div>
</body>
</html>

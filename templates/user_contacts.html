<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>紧急联系人管理</title>
    <style>
        body {
            margin: 0;
            font-family: "Microsoft YaHei", Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
        }
        .header {
            background: linear-gradient(135deg, #4f8cff, #35c2a1);
            color: white;
            padding: 26px 50px;
        }
        .header h1 {
            margin: 0;
            font-size: 30px;
        }
        .container {
            padding: 30px 50px;
        }
        .panel {
            background: white;
            border-radius: 14px;
            padding: 24px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.08);
            margin-bottom: 24px;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }
        .back {
            text-decoration: none;
            color: #2f6fed;
            font-weight: bold;
            background: #eef4ff;
            padding: 9px 14px;
            border-radius: 8px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 15px;
        }
        th {
            background: #f0f5ff;
            color: #333;
            padding: 12px;
            text-align: left;
        }
        td {
            padding: 12px;
            border-bottom: 1px solid #eee;
        }
        tr:hover {
            background: #f9fbff;
        }
        label {
            display: block;
            margin-top: 14px;
            margin-bottom: 6px;
            font-weight: bold;
        }
        input {
            width: 100%;
            box-sizing: border-box;
            padding: 11px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
        }
        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }
        .btn {
            margin-top: 20px;
            border: none;
            padding: 12px 18px;
            border-radius: 8px;
            background: #2f6fed;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        .msg {
            margin-bottom: 16px;
            padding: 12px;
            border-radius: 8px;
            background: #e9f8f0;
            color: #1f9d55;
            font-weight: bold;
        }
        .status {
            padding: 5px 9px;
            border-radius: 20px;
            background: #e9f8f0;
            color: #1f9d55;
            font-weight: bold;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>紧急联系人管理</h1>
    </div>

    <div class="container">
        <div class="panel">
            <div class="top-bar">
                <h2>{{ username }} 的紧急联系人</h2>
                <a class="back" href="/user/home">返回用户首页</a>
            </div>

            {% if message %}
                <div class="msg">{{ message }}</div>
            {% endif %}

            <table>
                <thead>
                    <tr>
                        <th>序号</th>
                        <th>联系人姓名</th>
                        <th>关系</th>
                        <th>手机号</th>
                        <th>邮箱</th>
                        <th>状态</th>
                    </tr>
                </thead>
                <tbody>
                    {% for contact in contacts %}
                    <tr>
                        <td>{{ loop.index }}</td>
                        <td>{{ contact.contact_name }}</td>
                        <td>{{ contact.relationship }}</td>
                        <td>{{ contact.phone }}</td>
                        <td>{{ contact.email }}</td>
                        <td><span class="status">{{ contact.status }}</span></td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>

        <div class="panel">
            <h2>新增紧急联系人</h2>
            <form method="post">
                <div class="row">
                    <div>
                        <label>联系人姓名</label>
                        <input type="text" name="contact_name" placeholder="请输入联系人姓名" required>
                    </div>
                    <div>
                        <label>关系</label>
                        <input type="text" name="relationship" placeholder="例如：母亲、朋友、子女" required>
                    </div>
                </div>

                <div class="row">
                    <div>
                        <label>手机号</label>
                        <input type="text" name="phone" placeholder="请输入手机号">
                    </div>
                    <div>
                        <label>邮箱</label>
                        <input type="email" name="email" placeholder="请输入邮箱">
                    </div>
                </div>

                <button class="btn" type="submit">添加联系人</button>
            </form>
        </div>
    </div>
</body>
</html>
